<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.8rem;
        }
        
        .date-group {
            margin-bottom: 24px;
        }
        
        label {
            display: block;
            color: #555;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }
        
        .input-row {
            display: flex;
            gap: 10px;
        }
        
        input[type="text"],
        input[type="date"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        
        input[type="text"]:focus,
        input[type="date"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }
        
        input[type="text"] {
            flex: 1.2;
        }
        
        input[type="date"] {
            flex: 0.8;
        }
        
        .hint {
            color: #888;
            font-size: 0.8rem;
            margin-top: 6px;
        }
        
        .result-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            margin-top: 30px;
        }
        
        .result-number {
            font-size: 4rem;
            font-weight: 700;
            color: white;
            line-height: 1;
        }
        
        .result-label {
            color: rgba(255,255,255,0.9);
            font-size: 1.2rem;
            margin-top: 8px;
        }
        
        .result-detail {
            color: rgba(255,255,255,0.75);
            font-size: 0.9rem;
            margin-top: 12px;
        }
        
        .error {
            background: #fee;
            color: #c00;
            padding: 12px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Week Calculator</h1>
        
        <div class="date-group">
            <label for="startDateText">Start Date</label>
            <div class="input-row">
                <input type="text" id="startDateText" placeholder="MM/DD/YYYY">
                <input type="date" id="startDatePicker">
            </div>
            <div class="hint">Enter date as MM/DD/YYYY or use the calendar</div>
        </div>
        
        <div class="date-group">
            <label for="endDateText">End Date (optional)</label>
            <div class="input-row">
                <input type="text" id="endDateText" placeholder="MM/DD/YYYY">
                <input type="date" id="endDatePicker">
            </div>
            <div class="hint">Defaults to today if left empty</div>
        </div>
        
        <div class="error" id="errorBox"></div>
        
        <div class="result-box">
            <div class="result-number" id="weeksNumber">0</div>
            <div class="result-label">weeks</div>
            <div class="result-detail" id="resultDetail"></div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'weekCalc_startDate';
        const DEFAULT_START = '2024-05-01';
        
        const startDateText = document.getElementById('startDateText');
        const startDatePicker = document.getElementById('startDatePicker');
        const endDateText = document.getElementById('endDateText');
        const endDatePicker = document.getElementById('endDatePicker');
        const weeksNumber = document.getElementById('weeksNumber');
        const resultDetail = document.getElementById('resultDetail');
        const errorBox = document.getElementById('errorBox');
        
        function formatDateForDisplay(dateStr) {
            if (!dateStr) return '';
            const [year, month, day] = dateStr.split('-');
            return `${month}/${day}/${year}`;
        }
        
        function parseTextDate(text) {
            if (!text) return null;
            const cleaned = text.trim();
            
            const match = cleaned.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if (match) {
                const month = match[1].padStart(2, '0');
                const day = match[2].padStart(2, '0');
                const year = match[3];
                return `${year}-${month}-${day}`;
            }
            
            const isoMatch = cleaned.match(/^(\d{4})-(\d{2})-(\d{2})$/);
            if (isoMatch) {
                return cleaned;
            }
            
            return null;
        }
        
        function isValidDate(dateStr) {
            if (!dateStr) return false;
            const date = new Date(dateStr + 'T00:00:00');
            return !isNaN(date.getTime());
        }
        
        function calculateWeeks() {
            errorBox.style.display = 'none';
            
            let startDate = startDatePicker.value;
            if (!startDate) {
                const parsed = parseTextDate(startDateText.value);
                if (parsed && isValidDate(parsed)) {
                    startDate = parsed;
                }
            }
            
            if (!startDate || !isValidDate(startDate)) {
                showError('Please enter a valid start date');
                weeksNumber.textContent = '0';
                resultDetail.textContent = '';
                return;
            }
            
            let endDate = endDatePicker.value;
            if (!endDate) {
                const parsed = parseTextDate(endDateText.value);
                if (parsed && isValidDate(parsed)) {
                    endDate = parsed;
                }
            }
            
            if (!endDate) {
                endDate = new Date().toISOString().split('T')[0];
            }
            
            if (!isValidDate(endDate)) {
                showError('Please enter a valid end date');
                return;
            }
            
            const start = new Date(startDate + 'T00:00:00');
            const end = new Date(endDate + 'T00:00:00');
            
            if (start > end) {
                showError('Start date must be before end date');
                weeksNumber.textContent = '0';
                resultDetail.textContent = '';
                return;
            }
            
            const diffTime = end.getTime() - start.getTime();
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            const weeks = Math.floor(diffDays / 7);
            const remainingDays = diffDays % 7;
            
            weeksNumber.textContent = weeks;
            
            const startFormatted = formatDateForDisplay(startDate);
            const endFormatted = formatDateForDisplay(endDate);
            let detail = `From ${startFormatted} to ${endFormatted}`;
            if (remainingDays > 0) {
                detail += ` (${diffDays} days total, ${remainingDays} extra day${remainingDays > 1 ? 's' : ''})`;
            }
            resultDetail.textContent = detail;
            
            localStorage.setItem(STORAGE_KEY, startDate);
        }
        
        function showError(message) {
            errorBox.textContent = message;
            errorBox.style.display = 'block';
        }
        
        function syncStartDate(fromPicker) {
            if (fromPicker) {
                startDateText.value = formatDateForDisplay(startDatePicker.value);
            } else {
                const parsed = parseTextDate(startDateText.value);
                if (parsed && isValidDate(parsed)) {
                    startDatePicker.value = parsed;
                }
            }
            calculateWeeks();
        }
        
        function syncEndDate(fromPicker) {
            if (fromPicker) {
                endDateText.value = formatDateForDisplay(endDatePicker.value);
            } else {
                const parsed = parseTextDate(endDateText.value);
                if (parsed && isValidDate(parsed)) {
                    endDatePicker.value = parsed;
                }
            }
            calculateWeeks();
        }
        
        startDatePicker.addEventListener('change', () => syncStartDate(true));
        startDateText.addEventListener('input', () => syncStartDate(false));
        startDateText.addEventListener('blur', () => syncStartDate(false));
        
        endDatePicker.addEventListener('change', () => syncEndDate(true));
        endDateText.addEventListener('input', () => syncEndDate(false));
        endDateText.addEventListener('blur', () => syncEndDate(false));
        
        function init() {
            const savedStart = localStorage.getItem(STORAGE_KEY) || DEFAULT_START;
            startDatePicker.value = savedStart;
            startDateText.value = formatDateForDisplay(savedStart);
            
            const today = new Date().toISOString().split('T')[0];
            endDatePicker.value = today;
            endDateText.value = formatDateForDisplay(today);
            
            calculateWeeks();
        }
        
        init();
    </script>
</body>
</html>
